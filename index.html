<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#efe6d0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="像素待办">
<title>像素待办</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css?v=4">
</head>
<body>
<div id="app">
  <header>
    <div class="top">
      <h1>待办<span class="cursor">_</span></h1>
      <div class="tools">
        <button id="themeBtn" class="tool" type="button">暗色</button>
        <button id="soundBtn" class="tool" type="button">静音</button>
      </div>
    </div>

    <div class="countdown" id="cdWrap" role="button" title="点按设置考研日期">
      <span class="cd-label">距考研还有</span>
      <span class="cd-num"><span id="cdDays">--</span><span class="cd-unit">天</span></span>
    </div>
    <div class="cd-edit" id="cdEdit" hidden>
      <span class="cd-label">考研日期</span>
      <input type="date" id="cdInput">
    </div>

    <div class="date" id="date"></div>
    <div class="bar"><div class="bar-fill" id="barFill"></div></div>
    <div class="stats">
      <span id="left">0 项未完成</span>
      <span id="done">0 项已完成</span>
      <button id="clearBtn" class="mini" type="button" style="display:none">清除已完成</button>
    </div>
  </header>

  <section class="heat open" id="heat">
    <button class="heat-head" id="heatToggle" type="button">
      <span>打卡记录 <span class="arrow">▼</span></span>
      <span class="streak" id="streak">连续打卡 0 天</span>
    </button>
    <div class="heat-body" id="heatBody">
      <div class="heat-grid" id="heatGrid"></div>
      <div class="legend">少 <i class="l1"></i><i class="l2"></i><i class="l3"></i><i class="l4"></i> 多</div>
    </div>
  </section>

  <main>
    <ul id="list"></ul>
    <div id="empty">还没有任务<br><span class="blink">在下方添加一个</span></div>
  </main>

  <footer>
    <div class="filters">
      <button class="chip active" data-f="all" type="button">全部</button>
      <button class="chip" data-f="active" type="button">未完成</button>
      <button class="chip" data-f="done" type="button">已完成</button>
    </div>
    <div class="filters cats">
      <button class="chip active" data-cat="all" type="button">全部科目</button>
      <button class="chip" data-cat="数学" type="button">数学</button>
      <button class="chip" data-cat="英语" type="button">英语</button>
      <button class="chip" data-cat="408" type="button">408</button>
      <button class="chip" data-cat="政治" type="button">政治</button>
      <button class="chip" data-cat="其他" type="button">其他</button>
    </div>
    <form id="addForm" autocomplete="off">
      <div class="sel">
        <select id="catSel">
          <option value="数学">数学</option>
          <option value="英语">英语</option>
          <option value="408">408</option>
          <option value="政治">政治</option>
          <option value="其他" selected>其他</option>
        </select>
      </div>
      <input id="input" type="text" placeholder="添加任务..." maxlength="80">
      <button id="addBtn" type="submit">添加</button>
    </form>
    <div class="pomo">
      <button class="pomo-time" id="pomoTime" type="button" title="点按切换时长">25:00</button>
      <button class="pomo-ctl" id="pomoCtl" type="button">开始</button>
      <button class="pomo-ctl" id="pomoReset" type="button">重置</button>
      <span class="pomo-stats" id="pomoStats">今日 0 分</span>
    </div>
    <p class="hint">点文字编辑 / 点标签换科目 / 点方块勾选</p>
  </footer>
  <div class="toast" id="toast"></div>
</div>
<script src="app.js?v=4"></script>
</body>
</html>
